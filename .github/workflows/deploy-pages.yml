name: 部署 GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 整理静态网站文件
        run: |
          mkdir _site
          cp index.html styles.css app.js .nojekyll _site/
          cp -R data _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
